<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 예전 앱(장례일정 /jangrye/ · DW관리 /admin/) 자리 (2026.10.23-6): DW장례업무 하나로 합침.
     예전 앱 아이콘으로 열면 이 안내가 보이고, 브라우저로 열면 바로 DW장례업무로 넘어감.
     기록은 로그인한 계정(서버)에 저장됨. 백업 파일 받기는 2026.10.29 에 없앰 (불러오기를 없앤 뒤라 쓸 곳이 없음).
     빌드: build.py 가 admin · DW관리 · DW관리는 이제 DW장례업무 「서식 → 회사 서류」에서 써요. · ../forms/admin.html · 2026.10.30-2 을 바꿔 넣음. 직접 고치지 말고 src/moved.html 을 고칠 것. -->
<title>DW장례업무로 합쳐졌습니다</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DW관리">
<meta name="robots" content="noindex">
<meta name="app-version" content="2026.10.30-2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/gukhwa-32.png">
<link rel="apple-touch-icon" href="icons/gukhwa-apple-180.png">
<script>
(function () {
  var sa = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  if (!sa) location.replace('../forms/admin.html');   /* 브라우저로 열면 (저장 공간이 같음) 바로 넘어감 */
})();
</script>
<style>
:root{--bg:#f3f3f1;--surface:#fff;--ink:#1c1d1f;--muted:#5a5e63;--line:#d6d7d4;--accent:#1c1d1f;--accent-ink:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121314;--surface:#1b1c1e;--ink:#ecebe8;--muted:#a3a6aa;--line:#2e3033;--accent:#ecebe8;--accent-ink:#121314;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.6 "Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:break-word;-webkit-tap-highlight-color:transparent;min-height:100dvh;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
main{width:100%;max-width:360px;display:grid;gap:14px;text-align:center}
img{width:72px;height:72px;border-radius:6px;margin:0 auto}
h1{margin:0;font-family:"Noto Serif KR","AppleMyungjo","Nanum Myeongjo",serif;font-size:23px;line-height:1.4}
p{margin:0;color:var(--muted);font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:4px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{font-size:13.5px}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<main>
  <img src="icons/gukhwa-192.png" alt="">
  <h1>DW장례업무로 합쳐졌습니다</h1>
  <p>DW관리는 이제 DW장례업무 「서식 → 회사 서류」에서 써요.</p>
  <a class="btn primary" href="../forms/admin.html">DW장례업무 열기</a>
  <p class="note">예전 아이콘을 지우면 이 기기의 기록이 같이 지워질 수 있습니다. 지우기 전에 DW장례업무에서 로그인해 주십시오.</p>
</main>
<script>
(function () {
  'use strict';
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function () {});
})();
</script>
</body>
</html>
