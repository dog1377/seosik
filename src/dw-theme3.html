     세 화면(장례업무 · 서식 첫 화면 · 회사 서류)의 맨 마지막에 build.py 가 넣음 → 색 · 글꼴 · 모서리 · 버튼 · 칸 · 카드 · 배지 · 표를 여기 한 곳에서 덮어씀.
     - 밝은 화면: 회색 바탕 #F5F7FA · 카드 #FCFCFD(테두리 없이 옅은 그림자, 16px) · 네이비 글자 #1B2537 · 주 버튼 파랑 #2457D6 · 버튼과 칸 10px

     - 글꼴 Pretendard 하나(앱 글꼴). 인쇄 · 이미지로 나가는 양식(보고서 그림 · 일정표 · 장례일정표 · 상담서)은 그대로.
     - 색 이름은 세 화면이 쓰는 이름을 모두 덮음(--surface-2 = --field, --line-2 = --edge, --gold = --bronze, --font-display = --serif)
