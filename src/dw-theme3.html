<!-- 디자인 3안 「큰 글씨 · 한 화면 한 일」 (2026.10.30 사용자가 시안 3안을 고름 + 「글씨체도 조금 더 차분하게」)
     세 화면(장례업무 · 서식 첫 화면 · 회사 서류)의 맨 마지막에 build.py 가 넣음 → 색 · 글꼴 · 모서리 · 주 버튼을 여기 한 곳에서 덮어씀.
     - 바탕은 밝은 회색, 상자는 흰 카드(모서리 16px), 버튼 · 칸 12px, 주 버튼은 먹색 · 굵게 · 크게(중요한 것은 화면 아래 고정 큰 버튼 .dw-cta)
     - 글꼴은 Pretendard 하나 — 예전 명조 제목도 Pretendard(600~700)로, 글자 간격 살짝 좁게 → 차분하게
     - 색 이름은 세 화면이 쓰는 이름을 모두 덮음(--surface-2 = --field, --line-2 = --edge, --gold = --bronze, --font-display = --serif) -->
<style id="dw-theme3">
:root{
  --bg:#f2f4f6; --surface:#ffffff; --field:#f7f8fa; --surface-2:#f7f8fa; --ink:#191b1f; --ink-2:#4e5258; --muted:#6b7178;
  --line:#e5e8eb; --edge:#a8aeb5; --line-2:#a8aeb5; --ph:#767b82; --accent:#191b1f; --accent-ink:#ffffff; --accent-soft:#eef0f3;
  --bronze:#8c6a1f; --gold:#8c6a1f; --gold-soft:#f5efe2; --warn:#a43c1c; --warn-soft:#fbeae4; --toast-bg:#191b1f; --toast-ink:#ffffff;
  --serif:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --font-display:var(--serif);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101113; --surface:#1b1d20; --field:#16181b; --surface-2:#16181b; --ink:#eceef0; --ink-2:#c5c9ce; --muted:#9ba1a8;
    --line:#2a2d32; --edge:#4c525a; --line-2:#4c525a; --ph:#8b9198; --accent:#eceef0; --accent-ink:#101113; --accent-soft:#25282c;
    --bronze:#d4b26a; --gold:#d4b26a; --gold-soft:#2e2719; --warn:#eea488; --warn-soft:#3a2219; --toast-bg:#eceef0; --toast-ink:#101113;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101113; --surface:#1b1d20; --field:#16181b; --surface-2:#16181b; --ink:#eceef0; --ink-2:#c5c9ce; --muted:#9ba1a8;
  --line:#2a2d32; --edge:#4c525a; --line-2:#4c525a; --ph:#8b9198; --accent:#eceef0; --accent-ink:#101113; --accent-soft:#25282c;
  --bronze:#d4b26a; --gold:#d4b26a; --gold-soft:#2e2719; --warn:#eea488; --warn-soft:#3a2219; --toast-bg:#eceef0; --toast-ink:#101113;
}
html body{background:var(--bg);letter-spacing:-.003em}
/* 글자: 제목은 Pretendard 굵게, 크기는 한 단계 차분하게 */
html body .ab-title b,html body .brand{font-size:17px;font-weight:700;letter-spacing:-.01em}
html body .page-intro h1,html body .tab-head h1{font-size:22px;font-weight:700;letter-spacing:-.015em}
html body .sec-head h2,html body .card h2,html body .out-head h2{font-weight:700;letter-spacing:-.01em}
html body .wz-card .wz-q{font-weight:700;letter-spacing:-.02em}
html body .wz-total b,html body .cp-t,html body .w-label,html body .bd-title b,html body .ps-h h2{font-weight:700;letter-spacing:-.01em}
/* 위 막대: 흰 바탕 · 옅은 선 */
html body header.appbar{background:var(--surface);border-bottom:1px solid var(--line);box-shadow:none}
/* 모서리: 상자 16px · 버튼과 칸 12px · 칸 안 작은 버튼 · 표시 8~10px · 주 버튼 14px · 아래에서 올라오는 창 20px (앞의 「모서리 통일」 규칙보다 이기게 :root body 를 붙임) */
:root body .sec,:root body .out,:root body .case-panel,:root body .case-steps,:root body .co-card,:root body .wz-card,:root body .wz-review,:root body .case-pick,:root body .lv-dd,:root body .lv-table,:root body .settle-guide,:root body .calc,:root body .sum,:root body .px-pv,:root body .sz-box,:root body .env-stat,:root body .env-prev,:root body .env-event,:root body .env-lock,:root body .env-form,:root body .acc,:root body .set-cards button,:root body .card,:root body .w-card,:root body .st-card,:root body .type-card,:root body .d-card,:root body .r-card,:root body .install-card,:root body .banner,:root body .stat,:root body .boxed{border-radius:16px}
:root body .btn,:root body .btn.sm,:root body .btn.link,:root body #newCase,:root body #saveNow,:root body .input,:root body .seg,:root body .sel,:root body label.field input,:root body label.field select,:root body label.field textarea,:root body .icon-btn,:root body .cp-go,:root body .text-out,:root body .wz-choice button,:root body .chip,:root body .group-tabs,:root body .sub-fold,:root body .missing,:root body .co-symbol,:root body .cm-nav,:root body .rp{border-radius:12px}
:root body .seg button,:root body .group-tabs button,:root body .ph button,:root body .acc-b button,:root body .tp-grid button,:root body .csheet-list button,:root body .burial-seg button,:root body .missing button,:root body .ch-btn,:root body .check,:root body .lv-st,:root body .tag,:root body .pt-step,:root body .item .tog{border-radius:9px}
:root body .wz-amt .input{border-radius:0}
:root body .btn.primary{border-radius:14px;font-weight:700}
:root body .csheet{border-radius:20px 20px 0 0}
:root body .sheet{border-radius:20px}
@media (min-width:700px){ :root body .csheet{border-radius:20px} }
:root body .toast{border-radius:12px}
/* 화면 아래 고정 큰 주 버튼 (휴대폰) — 새 행사 · 새 배송 · 주간보고 등 그 화면에서 가장 중요한 일 하나 */
.dw-cta{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 32%);pointer-events:none}
.dw-cta-btn{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:560px;height:56px;margin:0 auto;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:17px;font-weight:700;letter-spacing:-.01em;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s ease}
.dw-cta-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.dw-cta-btn:active{transform:scale(.98)}
.dw-cta-btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.dw-cta-btn{transition:none}.dw-cta-btn:active{transform:none}}
@media (min-width:700px){ .dw-cta{position:static;padding:18px 0 0;background:none}.dw-cta-btn{max-width:340px;margin:0} }
@media (max-width:699px){ html.dw-at-home body .toast,html body[data-tab="list"] .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))} }   /* 알림이 아래 큰 버튼을 가리지 않게 */
</style>
