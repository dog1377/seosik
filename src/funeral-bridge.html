<!-- 서식함 연결: build.py가 funeral.html 맨 끝에 넣는 부분입니다. 서식함과 같은 색·글꼴·양식을 입히고, 서식함으로 오가는 버튼을 붙입니다. -->
<style id="mf-theme">
/* 서식함과 같은 색 (밝은 화면 / 어두운 화면) */
:root{
  --bg:#f1f2ef; --surface:#ffffff; --field:#f6f7f4; --ink:#1a2128; --ink-2:#3a444d; --muted:#5d6771;
  --line:#dcdfda; --edge:#c3c8c3; --ph:#8a939b; --accent:#2a4759; --accent-ink:#ffffff; --accent-soft:#e1e9ee;
  --bronze:#80601d; --warn:#953d1b; --warn-soft:#f6e3d9; --shadow:none; --radius:14px;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Noto Serif KR","AppleMyungjo","Nanum Myeongjo",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111518; --surface:#1a2025; --field:#151a1e; --ink:#e6e9eb; --ink-2:#c3cbd1; --muted:#9ba5ae;
    --line:#2a3239; --edge:#3b464e; --ph:#77828b; --accent:#9fc2d8; --accent-ink:#0e1a22; --accent-soft:#213440;
    --bronze:#d8b46a; --warn:#efa27e; --warn-soft:#3a2419; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111518; --surface:#1a2025; --field:#151a1e; --ink:#e6e9eb; --ink-2:#c3cbd1; --muted:#9ba5ae;
  --line:#2a3239; --edge:#3b464e; --ph:#77828b; --accent:#9fc2d8; --accent-ink:#0e1a22; --accent-soft:#213440;
  --bronze:#d8b46a; --warn:#efa27e; --warn-soft:#3a2419; --shadow:none;
}
body{background:var(--bg);font-family:var(--sans);letter-spacing:normal;line-height:1.55}

/* 위쪽 막대와 제목: 서식함처럼 바탕색 위에 명조 제목 */
.appbar{background:var(--bg);border-bottom:1px solid var(--line)}
.ab-title small{font-size:12px;color:var(--muted);letter-spacing:normal}
.ab-title b{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.01em}
.page-intro h1{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:normal;line-height:1.3;text-wrap:balance}
.page-intro p{font-size:14px;color:var(--muted);letter-spacing:normal}
.intro-mark{display:none}
.sn-head b{font-family:var(--serif);font-size:18px;letter-spacing:.01em}
.sheet h2{font-family:var(--serif);font-size:21px;letter-spacing:normal}

/* 카드 */
.sec,.out,.case-panel,.co-card{border:1px solid var(--line);border-radius:14px;box-shadow:none;background:var(--surface)}
.sec,.out{padding:18px 16px;gap:16px}
.sec-head{border-bottom:0;padding-bottom:0}
.sec-head h2,.out-head h2{font-size:16px;font-weight:700;letter-spacing:normal}
.sec-num{color:var(--muted)}

/* 입력칸: 흰 바탕, 회색 테두리, 16px 글자 */
label.f,.f-wrap{font-size:13px;font-weight:500;letter-spacing:normal}
label.f>.field-label{color:var(--muted)}
.input,.ch-btn{background-color:var(--surface);border:1px solid var(--edge);border-radius:10px;font-size:16px;letter-spacing:normal}
.input:hover,.ch-btn:hover{border-color:var(--edge)}
.input:focus,.ch-btn.open{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input::placeholder{color:var(--ph);letter-spacing:normal}
.input:disabled{background:var(--field)}
.case-row .input{background-color:transparent;border:0;box-shadow:none}
.text-out{background:var(--field);border:1px solid var(--line);letter-spacing:normal}
.calc,.sum{background:var(--field);border:1px solid var(--line)}
.required-dot{background:var(--warn)}

/* 버튼 */
.btn{border-radius:12px;font-weight:500;letter-spacing:normal}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:none}
.btn.primary:hover{filter:none;background:var(--accent)}
.btn.sm{border-radius:10px}
.btn.link{background:var(--accent-soft);color:var(--accent);border-radius:9px}
#newCase{border-radius:12px}

/* 고르는 칸(기본 정보 · 장례 일정 …): 서식함의 선택 막대와 같게 */
.group-tabs{background:var(--field);border:1px solid var(--line);padding:3px;gap:3px;border-radius:12px}
.group-tabs button{border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);min-height:42px}
.group-tabs button[aria-pressed="true"]{background:var(--surface);color:var(--accent);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.work-tabs{border-bottom-color:var(--line)}
.work-tabs button{letter-spacing:normal}
.chip{border-radius:999px}
.co-btn{background:var(--surface);border-color:var(--line)}
.co-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.item .tog{background:var(--accent-soft);color:var(--accent)}

/* 아래 메뉴: 서식함 탭 막대와 같게 */
.mobile-nav{background:var(--surface);border-top:1px solid var(--line)}
.mobile-nav button{font-size:12px;color:var(--muted);gap:3px}
.mobile-nav .ui-icon{width:22px;height:22px;stroke-width:1.8}
.mobile-nav button[aria-current="page"]{background:none;color:var(--accent);font-weight:700}

/* 왼쪽 메뉴 */
.acc-b button.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.toast{background:var(--ink);color:var(--surface);border-radius:12px;box-shadow:none}
</style>
<style id="mf-bridge">
.mf-home{display:inline-flex;align-items:center;justify-content:center;gap:5px;flex:none;height:40px;padding:0 11px;border:1px solid var(--edge,#dce3ec);border-radius:12px;background:var(--surface,#fff);color:var(--ink,#182538);font:inherit;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer}
.mf-home svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mf-home:focus-visible{outline:2px solid var(--accent,#293f65);outline-offset:2px}
.ab-title{min-width:0}
.ab-title b,.ab-title small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
@media (max-width:380px){.mf-home span{display:none}.mf-home{width:40px;padding:0}}
</style>
<script>
(function () {
  'use strict';
  function setLast(v) { try { localStorage.setItem('mf.lastApp', v); } catch (e) { /* ignore */ } }
  function toForms(tab) { setLast('forms'); location.replace('./#' + (tab || 'weekly')); }
  setLast('funeral');

  var DOC = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h6"/></svg>';

  // 앱 위쪽 막대: 서식함으로 돌아가는 버튼
  var bar = document.querySelector('.ab-in');
  if (bar) {
    var home = document.createElement('button');
    home.type = 'button';
    home.className = 'mf-home';
    home.setAttribute('aria-label', '관리자 서식함으로 가기');
    home.innerHTML = DOC + '<span>서식함</span>';
    home.addEventListener('click', function () { toForms('weekly'); });
    bar.insertBefore(home, document.getElementById('newCase'));
  }

  // 왼쪽 메뉴: 서식함 바로가기
  var body = document.querySelector('#sideNav .sn-body');
  if (body) {
    var acc = document.createElement('div');
    acc.className = 'acc';
    acc.setAttribute('data-acc', 'forms');
    acc.innerHTML =
      '<button class="acc-h" type="button" aria-expanded="true"><span>' + DOC + '서식함</span><i></i></button>' +
      '<div class="acc-b"><div>' +
      '<button type="button" data-mf="weekly">주간 파트 보고</button>' +
      '<button type="button" data-mf="review">후기 일일보고</button>' +
      '<button type="button" data-mf="ship">용품 · 근조기 탁송</button>' +
      '<button type="button" data-mf="settings">서식함 설정 · 백업</button>' +
      '</div></div>';
    acc.addEventListener('click', function (e) {
      var b = e.target.closest('[data-mf]');
      if (b) toForms(b.getAttribute('data-mf'));
    });
    body.appendChild(acc);
  }

  // 휴무 · 당직 화면(안쪽 창)에도 같은 색과 글꼴
  var DUTY_THEME = ':root{--bg:#f1f2ef;--surface:#ffffff;--surface-2:#f6f7f4;--line:#dcdfda;--line-2:#e8eae6;' +
    '--text:#1a2128;--text-2:#3a444d;--muted:#5d6771;--faint:#8a939b;' +
    '--primary:#2a4759;--primary-600:#1f3646;--primary-50:#e1e9ee;--primary-100:#cfdce4;' +
    '--a:#2a4759;--a-bg:#e1e9ee;--b:#80601d;--b-bg:#f2e9d4;--sat:#2a5d8f;' +
    '--r:12px;--r-sm:9px;--sh-1:none;--font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}' +
    'body{letter-spacing:normal}';
  var duty = document.getElementById('dutyFrame');
  if (duty) {
    duty.addEventListener('load', function () {
      try {
        var d = duty.contentDocument;
        if (!d || !d.head || d.getElementById('mf-duty-theme')) return;
        var link = d.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap';
        d.head.appendChild(link);
        var st = d.createElement('style');
        st.id = 'mf-duty-theme';
        st.textContent = DUTY_THEME;
        d.head.appendChild(st);
      } catch (e) { /* ignore */ }
    });
  }

  // 인터넷이 약해도 열리도록 같은 오프라인 저장을 씁니다
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function () {});
})();
</script>
