<script>
(function () {
  'use strict';
  try { localStorage.setItem('mf.lastApp', 'funeral'); } catch (e) { /* ignore */ }
  window.DW_MODE = 'event';
  /* 「서식」으로 바꾸기: 지금 기록을 저장한 뒤 서식 칸(마지막에 본 서식) */
  window.DW_MODE_GO = function (to) {
    if (to !== 'forms') return false;
    try { if (typeof save === 'function') save(); } catch (e) { /* ignore */ }
    try { localStorage.setItem('mf.lastApp', 'forms'); } catch (e) { /* ignore */ }
    location.replace('./#forms');
    return true;
  };
})();
</script>
