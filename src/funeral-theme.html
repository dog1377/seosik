<style id="mf-theme">
/* 디자인 A · 부고장: 흰 종이 · 먹색 · 명조 (밝은 화면 / 어두운 화면) */
:root{
  --bg:#f3f3f1; --surface:#ffffff; --field:#f7f7f5; --ink:#1c1d1f; --ink-2:#3d4044; --muted:#5a5e63;
  --line:#d6d7d4; --edge:#9a9d9a; --ph:#6a6e73; --accent:#1c1d1f; --accent-ink:#ffffff; --accent-soft:#ececea;
  --bronze:#8c6a1f; --warn:#9a3b1e; --warn-soft:#f7e6de; --shadow:none; --radius:6px;
  --sans:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --serif:"Noto Serif KR","AppleMyungjo","Nanum Myeongjo",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121314; --surface:#1b1c1e; --field:#17181a; --ink:#ecebe8; --ink-2:#c9c8c4; --muted:#a3a6aa;
    --line:#2e3033; --edge:#5f6368; --ph:#8d9196; --accent:#ecebe8; --accent-ink:#121314; --accent-soft:#2b2d30;
    --bronze:#d4b26a; --warn:#eea488; --warn-soft:#3a2219; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121314; --surface:#1b1c1e; --field:#17181a; --ink:#ecebe8; --ink-2:#c9c8c4; --muted:#a3a6aa;
  --line:#2e3033; --edge:#5f6368; --ph:#8d9196; --accent:#ecebe8; --accent-ink:#121314; --accent-soft:#2b2d30;
  --bronze:#d4b26a; --warn:#eea488; --warn-soft:#3a2219; --shadow:none;
}
body{background:var(--bg);font-family:var(--sans);font-variant-numeric:tabular-nums;letter-spacing:normal;line-height:1.55;word-break:keep-all;overflow-wrap:break-word}

/* 위쪽 막대와 제목: 서식함처럼 바탕색 위에 명조 제목 */
.appbar{background:var(--bg);border-bottom:1px solid var(--line)}
.ab-title small{font-size:12px;color:var(--muted);letter-spacing:normal}
.ab-title b{font-family:var(--serif);font-size:18px;font-weight:700;letter-spacing:.01em}
.page-intro h1{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:normal;line-height:1.3;text-wrap:balance}
.page-intro p{font-size:14px;color:var(--muted);letter-spacing:normal}
.intro-mark{display:none}
.sn-head b{font-family:var(--serif);font-size:18px;letter-spacing:.01em}
.sheet h2{font-family:var(--serif);font-size:21px;letter-spacing:normal}

/* 카드 */
.sec,.out,.case-panel,.co-card{border:1px solid var(--line);border-radius:14px;box-shadow:none;background:var(--surface)}
.sec,.out{padding:18px 16px;gap:16px}
.sec-head{border-bottom:0;padding-bottom:0}
.sec-head h2,.out-head h2{font-size:16px;font-weight:700;letter-spacing:normal}
.sec-num{color:var(--muted)}

/* 입력칸: 흰 바탕, 회색 테두리, 16px 글자 */
label.f,.f-wrap{font-size:13px;font-weight:500;letter-spacing:normal}
label.f>.field-label{color:var(--muted)}
.input,.ch-btn{background-color:var(--surface);border:1px solid var(--edge);border-radius:10px;font-size:16px;letter-spacing:normal}
@media (hover:hover){.input:hover,.ch-btn:hover{border-color:var(--edge)}}
.input:focus,.ch-btn.open{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input::placeholder{color:var(--ph);letter-spacing:normal}
.input:disabled{background:var(--field)}
.case-row .input{background-color:transparent;border:0;box-shadow:none}
.text-out{background:var(--field);border:1px solid var(--line);letter-spacing:normal}
.calc,.sum{background:var(--field);border:1px solid var(--line)}
.required-dot{background:var(--warn)}

/* 버튼 */
.btn{border-radius:12px;font-weight:500;letter-spacing:normal}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:none}
@media (hover:hover){.btn.primary:hover{filter:none;background:var(--accent)}}
.btn.sm{border-radius:10px}
.btn.link{background:var(--accent-soft);color:var(--accent);border-radius:9px}
#newCase{border-radius:12px}

/* 고르는 칸(기본 정보 · 장례 일정 …): 서식함의 선택 막대와 같게 */
.group-tabs{background:var(--field);border:1px solid var(--line);padding:3px;gap:3px;border-radius:12px}
.group-tabs button{border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);min-height:42px}
.group-tabs button[aria-pressed="true"]{background:var(--surface);color:var(--accent);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.work-tabs{border-bottom-color:var(--line)}
.work-tabs button{letter-spacing:normal}
.chip{border-radius:999px}
.co-btn{background:var(--surface);border-color:var(--line)}
@media (hover:hover){.co-btn:hover{border-color:var(--accent);background:var(--accent-soft)}}
.item .tog{background:var(--accent-soft);color:var(--accent)}

/* 아래 메뉴: 서식함 탭 막대와 같게 */
.mobile-nav{background:var(--surface);border-top:1px solid var(--line)}
.mobile-nav button{font-size:12px;color:var(--muted);gap:3px}
.mobile-nav .ui-icon{width:22px;height:22px;stroke-width:1.8}
.mobile-nav button[aria-current="page"]{background:none;color:var(--accent);font-weight:700}

/* 왼쪽 메뉴 */
.acc-b button.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.toast{background:var(--ink);color:var(--surface);border-radius:12px;box-shadow:none}

/* ---------- 디자인 A · 부고장 ----------
   흰 종이 위에 먹색. 위아래 막대는 먹색 가는 선으로 테두리처럼, 제목은 명조, 버튼 · 칸은 덜 둥글게.
   보내는금액은 부고장처럼 두 줄 테두리 안에 명조로 */
.appbar{background:var(--surface);border-bottom:1px solid var(--ink)}
.mobile-nav{border-top:1px solid var(--ink)}
.mobile-nav button[aria-current="page"]{color:var(--ink)}
.sec,.out,.case-panel,.co-card,.wz-card,.wz-review{border-radius:6px}
.sec-head h2{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:0}
.sec-num{font-family:var(--sans);font-weight:500}
.btn,.btn.sm,#newCase,.btn.link{border-radius:4px}
#newCase{background:var(--surface);color:var(--ink);border:1px solid var(--ink)}
@media (hover:hover){#newCase:hover{background:var(--accent-soft)}}
.input,.ch-btn{border-radius:4px}
.input:focus,.ch-btn.open{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.group-tabs{border-radius:6px}
.group-tabs button{border-radius:4px}
.group-tabs button[aria-pressed="true"]{color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.chip{border-radius:4px}
.co-btn{border-radius:4px}
.item .tog{border-radius:4px;background:var(--accent-soft);color:var(--ink)}
.toast{border-radius:4px}
/* 정산: 질문은 큰 명조, 금액 칸은 밑줄만, 진행 줄은 먹색 가는 줄 */
.wz-card{border:1px solid var(--line)}
.wz-card .wz-q{font-family:var(--serif);font-weight:700;letter-spacing:-.01em;line-height:1.38}
.wz-prog{height:2px;border-radius:0;background:var(--line)}
.wz-prog i{border-radius:0;background:var(--ink)}
.wz-amt .input{border:0;border-bottom:2px solid var(--ink);border-radius:0;background:transparent;padding-left:0;font-size:42px;font-weight:600;letter-spacing:-.02em;min-height:72px;box-shadow:none}
.wz-amt .input:focus{border-bottom-color:var(--ink);box-shadow:none}
.wz-amt .amt-u{right:0}
.wz-go{border-radius:4px}
.wz-card .wz-choice button{border-radius:4px;background:var(--surface);border:1px solid var(--edge)}
.wz-card .wz-choice button[aria-pressed="true"]{border:2px solid var(--ink);background:var(--accent-soft);color:var(--ink)}
.wz-total{background:var(--surface);border:3px double var(--ink);border-radius:0;animation:none}
.wz-total b{font-family:var(--serif);font-weight:700;color:var(--ink);letter-spacing:-.01em}
.wz-total.neg{background:var(--surface);border-color:var(--warn)}
.wz-total.neg b{color:var(--warn)}
.wz-result,.calc,.ledger,.text-out,.ex,.mg,.rp,.rc-box,.wz-item,.wz-text,.missing,.def-alert,.def-me,.def-month,.def-row,.auto-mi,.snap-list,.sub-fold,.sub-block,.settle-guide,.sm-switch,.settle-bar,.bk-banner,.acc-h,.wz-back{border-radius:4px}
.env-event,.env-form,.env-stat,.env-prev,.env-lock{border-radius:6px}
/* 행사 입력: 한 칸씩 보기 */
.im-mode{border:0;background:none;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:40px;padding:0 4px}
.input-grid.step>.sec{min-height:260px}

/* 휴대폰: 할 일이 바로 보이게 위쪽을 줄임.
   화면 제목은 맨 위 막대에 이미 있고, 입력 · 보고서 · 정산은 아래 메뉴에 있어서 겹치는 것만 숨김 */
@media (max-width:699px){
  .page-intro,.work-tabs{display:none}
  .case-heading{display:none}
  /* 행사 기록 상자: 한 줄로 (‹ 달 · 건수 / 행사 이름 ▾ › 삭제) */
  .case-panel{display:grid;grid-template-columns:36px minmax(0,1fr) 36px auto;grid-template-areas:"prev lab next del" "prev sel next del";column-gap:8px;row-gap:0;align-items:center;padding:8px 10px}
  .case-panel .case-month,.case-panel .case-row{display:contents}
  #cmPrev{grid-area:prev} #cmNext{grid-area:next}
  .cm-nav{width:36px;height:36px}
  .case-panel .cm-label{grid-area:lab;display:flex;align-items:baseline;gap:6px;text-align:left;line-height:1.3;min-width:0}
  .case-panel .cm-label b{font-size:12px;font-weight:600;color:var(--muted)}
  .case-panel .cm-label span{font-size:12px}
  .case-panel #caseSel{grid-area:sel;min-height:30px;font-size:15px;padding:0 24px 0 0;background-position:right 2px center}
  .case-panel #delCase{grid-area:del;min-height:36px;padding:0 10px;font-size:12.5px}
  .case-panel #ttlNote{grid-column:1/-1}
  #ttlNote:not(.warn){display:none}
  body[data-tab="envelopes"] .top,body[data-tab="admin"] .top{display:none}
  .im-row{justify-content:space-between;margin-top:8px}
  .im-row .input-progress{display:inline;font-size:12.5px}
  .wz-amt .input{font-size:38px}
}
/* 모서리 · 그림자 통일 (디자인 통일 점검 2026.10.16): 버튼 · 칸 · 작은 표시 4px, 상자 · 창 6px, 그림자 대신 먹색 선 */
body .ab-menu,body .jr-x,body .jr-btn,body .cm-nav,body .co-symbol,body .x,body .pick-x,body .tp-clear,body .tp-grid button,body .mobile-nav button,
body .burial-seg button,body .missing button,body .ph button,body .seg,body .seg button,body .acc-b button,body .item .tog,body .csheet-list button,body .check,body .btn.link,body .group-tabs button{border-radius:4px}
body .jr-card,body .burial-seg,body .sum,body .must,body .fold-ex,body .acc,body .crem-preview,body .env-notice,body .warnline,body .calc,body .text-out,body .toast,body .sheet{border-radius:6px}
body .csheet{border-radius:6px 6px 0 0}
@media (min-width:700px){ body .csheet,body .sheet{border-radius:6px} }
body .settle-bar{border-radius:6px;box-shadow:none}
body .mf-home{border-radius:4px}
body .toast{box-shadow:none}
/* 보기 쉬움 점검 (2026.10.16): 글자 대비 4.5:1 이상 · 작은 글자 12px 이상 · 누르는 곳 44px 이상 · 아이폰에서 칸을 눌러도 화면이 확대되지 않게 16px */
.wz-amt .input:focus-visible{box-shadow:0 2px 0 var(--ink)}
body .sn-foot,body .env-badge,body #ttlNote,body .out-head h2 small,body .sec-head h2 small,body .sn-head small,body .sec-num,body .co-card small{font-size:12px}
@media (max-width:699px){
  body .appbar button,body #newCase,body #saveNow{min-height:44px}
  body #menuBtn,body .jr-x,body #snClose,body #wzBack{min-width:44px;min-height:44px}
  body .case-panel{grid-template-columns:44px minmax(0,1fr) 44px auto}
  body .cm-nav{width:44px;height:44px}
  body .case-panel #delCase{min-height:44px;min-width:46px}
  body .case-panel #caseSel{min-height:44px;font-size:16px}
  body .btn,body .btn.sm,body .co-card .btn,body .out-head .btn{min-height:44px}
  body .co-card .btn,body .out-head .btn{font-size:13px}
  body .group-tabs button{min-height:44px;font-size:12.5px}
  body .im-mode,body .im-row button,body .wz-top button,body .acc-h,body .missing button{min-height:44px}
  body .env-source>summary{min-height:44px;box-sizing:border-box;padding:12px 0}
  body .text-out,body .out textarea{font-size:16px!important}
  body .dt select.input,body .dt input[type="date"],body .mg select.input{font-size:16px}
  body .note{font-size:12.5px}
  body .co-card small,body .sec-num,body .field-hint,body .btn.link,body .env-cash thead th{font-size:12px}
  body .group-footer p{font-size:12.5px}
  body label.f,body .f-wrap{font-size:13px}
}
/* 손맛 다듬기 (audit-suite: make-interfaces-feel-better · emil-design-engineering · web-design-guidelines, 2026.10.16)
   누르면 살짝 눌림(0.12초) · 손가락으로 누른 뒤 남는 회색 표시와 마우스용 강조가 휴대폰에 남지 않게 · 제목 줄바꿈 고르게 · 창 안 스크롤이 뒤 화면으로 안 넘어가게 */
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,a,label,summary,select{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body .btn,body .co-btn,body .chip,body .missing button,body .seg button,body .cm-nav,body .group-tabs button{transition-property:transform,background-color,border-color,color,box-shadow;transition-duration:.12s;transition-timing-function:ease-out}
body .btn:active:not(:disabled),body .co-btn:active,body .chip:active,body .missing button:active,body .seg button:active,body .cm-nav:active:not(:disabled){transform:scale(.97)}
h1,h2,h3,.wz-q{text-wrap:balance}
.note,.wz-card p,.field-hint,.calc{text-wrap:pretty}
.sn-body,.csheet-list,.sheet,.tp-body{overscroll-behavior:contain}
@media (prefers-reduced-motion:reduce){body .btn:active,body .co-btn:active,body .chip:active,body .missing button:active,body .seg button:active,body .cm-nav:active{transform:none}}
</style>
<script>
(function () {

  var DUTY_THEME = ':root{--bg:#f3f3f1;--surface:#ffffff;--surface-2:#f7f7f5;--line:#d6d7d4;--line-2:#e6e6e3;' +

  // 어두운 화면: 장례일정과 같은 색 (휴대폰 설정을 따름)

    '--text:#ecebe8;--text-2:#c9c8c4;--muted:#a3a6aa;--faint:#8d9196;--primary:#ecebe8;--primary-600:#ffffff;--primary-50:#2b2d30;--primary-100:#3a3c40;' +

  DUTY_THEME += '@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){' + DUTY_DARK + '}}:root[data-theme="dark"]{' + DUTY_DARK + '}';

<style id="ab-compact">
