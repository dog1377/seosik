<!-- 따로 쓰는 「장례일정」 앱에만 붙는 부분: 설치 안내, 카카오톡 안에서 열렸을 때 바깥 브라우저로 넘기기. -->
<style id="jr-install">
.jr-card{margin:16px 0 0;background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:14px 16px;display:grid;gap:10px;font-size:14px;line-height:1.6}
.jr-card.warn{border-color:var(--warn);background:var(--warn-soft)}
.jr-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.jr-head b{font-size:15px}
.jr-card ol{margin:0;padding-left:20px;display:grid;gap:4px}
.jr-card p{margin:0}
.jr-row{display:flex;flex-wrap:wrap;gap:8px}
.jr-btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--edge);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.jr-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.jr-x{width:36px;height:36px;border:0;border-radius:9px;background:none;color:var(--muted);font-size:18px;cursor:pointer}
.jr-note{font-size:12.5px;color:var(--muted)}
</style>
<script>
(function () {
  'use strict';
  var ua = navigator.userAgent;
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var inApp = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|FB_IAB|Line\/|DaumApps|BAND\//i.test(ua);
  var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var desktop = !ios && !/Android|iPhone|iPad|iPod|Mobile|Tablet/i.test(ua);
  var main = document.getElementById('mainContent');
  if (!main || standalone) return;

  function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function url() { return location.href.split('#')[0]; }

  // 카카오톡 안에서 열리면 한 번 바깥 브라우저로 넘깁니다
  if (/KAKAOTALK/i.test(ua) && !ss('jr.kakaoOut')) {
    ss('jr.kakaoOut', '1');
    var go = function () { setTimeout(function () { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url()); }, 400); };
    if (document.readyState === 'complete') go(); else window.addEventListener('load', go, { once: true });
  }

  var card = document.createElement('section');
  card.className = 'jr-card';
  card.setAttribute('aria-label', '앱 설치 안내');
  main.insertBefore(card, main.firstChild);
  var deferred = null;

  function render() {
    var html;
    if (inApp) {
      card.classList.add('warn');
      html = '<div class="jr-head"><b>카카오톡 같은 앱 안에서 열렸어요</b></div>' +
        '<p>여기서는 기록 저장과 설치가 제대로 안 될 수 있어요. 주소를 복사해서 <b>Chrome</b>(안드로이드)이나 <b>Safari</b>(아이폰)에 붙여 넣어 열어 주세요.</p>' +
        '<div class="jr-row"><button class="jr-btn primary" type="button" data-jr="copy">주소 복사</button></div>';
    } else {
      if (ls('jr.installDismissed') === '1' && !deferred) { card.hidden = true; return; }
      card.hidden = false;
      var body;
      if (deferred) {
        body = '<p>설치하면 홈 화면의 「장례일정」 아이콘으로 바로 열리고, 인터넷이 약한 곳에서도 열려요.</p>' +
          '<div class="jr-row"><button class="jr-btn primary" type="button" data-jr="install">앱 설치</button></div>';
      } else if (ios) {
        body = '<ol><li>Safari 아래(또는 위)의 <b>공유 버튼</b>을 누르세요.</li><li><b>홈 화면에 추가</b>를 누르세요.</li><li>오른쪽 위 <b>추가</b>를 누르면 끝이에요.</li></ol>' +
          '<p class="jr-note">설치한 뒤에는 홈 화면 아이콘으로만 여세요. 아이폰은 Safari와 설치한 앱의 기록이 따로 보관돼요.</p>';
      } else if (desktop) {
        body = '<ol><li>Chrome·엣지 주소창 오른쪽 끝의 <b>설치</b> 아이콘을 누르세요.</li><li>안 보이면 오른쪽 위 메뉴(<b>⋮</b> 또는 <b>…</b>)에서 <b>앱 설치</b>를 찾으세요.</li></ol>' +
          '<p class="jr-note">PC에 저장한 기록은 휴대폰과 따로 보관돼요. 옮길 때는 설정 → 행사 기록 보관의 백업 파일을 쓰세요.</p>';
      } else {
        body = '<ol><li>Chrome 오른쪽 위 <b>⋮</b> 메뉴를 누르세요.</li><li><b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 누르세요.</li></ol>';
      }
      html = '<div class="jr-head"><b>앱으로 설치하기</b><button class="jr-x" type="button" data-jr="close" aria-label="설치 안내 닫기">✕</button></div>' + body;
    }
    card.innerHTML = html;
  }
  card.addEventListener('click', function (e) {
    var b = e.target.closest('[data-jr]'); if (!b) return;
    var a = b.getAttribute('data-jr');
    if (a === 'close') { ls('jr.installDismissed', '1'); card.hidden = true; }
    if (a === 'copy') {
      var done = function (ok) { b.textContent = ok ? '복사했어요' : url(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url()).then(function () { done(true); }, function () { done(false); });
      else done(false);
    }
    if (a === 'install' && deferred) {
      var p = deferred; deferred = null;
      Promise.resolve(p.prompt()).then(function () { return p.userChoice; }).catch(function () {}).then(render);
    }
  });
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; render(); });
  window.addEventListener('appinstalled', function () { deferred = null; card.hidden = true; });
  render();
})();
</script>
