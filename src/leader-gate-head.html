    chief: [['gather', '취합', 'gather', './#gather'], ['forms', '서식', 'doc', './#forms'], ['company', '회사 서류', 'brief', 'admin.html'], ['docs', '자료실', 'folder', './#docs'], ['settings', '설정', 'set', './#settings']]
  };
  function role() { var c = document.documentElement.classList; return c.contains('dw-chief') ? 'chief' : c.contains('dw-leader') ? 'leader' : 'member'; }

<script>
/* 계정마다 이 기기 기록 따로 · 10분 동안 안 쓰면 자동 로그아웃 (2026.10.28-20, 사용자: 「회원가입하면 가입한 사람은 정보가 하나도 없어야 함」 · 「10분 미조작시 자동 로그아웃」)
   - dw-owner = 이 기기에 지금 들어 있는 기록(장례업무 · 휴무 · 서식 · 회사 서류 · 자동 보관본 …)의 주인 계정 id.
     처음에는 예전 맞춤 표시(dw-sb-meta · dw-sync-* 의 uid)로 알아내고, 그것도 없으면 지금 로그인한 계정.
   - 로그인한 계정이 주인과 다르면 switch.html 로 보냄 → 주인 기록을 이 기기 보관함(IndexedDB dw-acct-stash)에 넣어 두고 비운 뒤,
     새 계정이 예전에 이 기기에 남긴 기록이 있으면 되살림. 지우는 기록은 없음(보관함에 남음). 그동안은 서버 맞추기를 멈춤(DW_HOLD).
   - dw-switching = 바꾸는 중 표시(끝나기 전에 앱이 꺼지면 다음에 열 때 마저 함), dw-last-act = 마지막으로 만진 시각(창 · 화면 공통). */
/* 휴대폰 · 태블릿인지 (2026.10.29 사용자: 「PC에서만 꺼지게, 모바일은 유지」) → 휴대폰 · 태블릿은 10분 자동 로그아웃 없이 로그인 유지, PC 만 10분 */
window.dwMobile = function () {
  try {
    var ua = navigator.userAgent || '', d = navigator.userAgentData;
    if (d && d.mobile) return true;
    if (/Android|iPhone|iPad|iPod|Mobi/i.test(ua)) return true;
    if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return true;   /* 아이패드(데스크톱 모드) */
    return !!(window.matchMedia && matchMedia('(hover: none) and (pointer: coarse)').matches);   /* 손가락만 쓰는 화면 */
  } catch (e) { return false; }
};
(function () {
  var root = document.documentElement, OK = 'dw-owner', SWK = 'dw-switching', IK = 'dw-last-act', IDLE = 10 * 60 * 1000;
  function g(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function metaUid(k) { try { var m = JSON.parse(g(k) || 'null'); return m && typeof m.uid === 'string' ? m.uid : ''; } catch (e) { return ''; } }
  function sessUid() { try { var x = JSON.parse(g('dw-sb-auth') || 'null'); return x && x.user && x.user.id || ''; } catch (e) { return ''; } }
  function owner() { return g(OK) || metaUid('dw-sb-meta') || metaUid('dw-sync-forms') || metaUid('dw-sync-company') || ''; }
  function here() { var p = location.pathname.split('/').pop() || ''; return (/^(index|funeral|admin)\.html$/.test(p) ? p : './') + (/^#[\w:-]*$/.test(location.hash) ? location.hash : ''); }
  function go(to, mode) {
    window.DW_HOLD = true; root.classList.add('dw-gated');
    location.replace('switch.html?to=' + encodeURIComponent(to || '') + '&m=' + (mode === 'join' ? 'join' : 'login') + '&back=' + encodeURIComponent(here()));
  }
  var loaded = sessUid();
  /* 고친 시각 표시 (2026.10.28-22): 서식 · 회사 서류 저장소가 고칠 때마다 창별로 시각을 적음 (dw-dirty-forms · dw-dirty-company = {창번호: 시각}).
     서버 맞추기(sync-kit)는 다른 창이 이 창을 연 뒤에 고친 적이 없을 때만 「다 올라감」(clean)을 적음 → 계정 바꿀 때(switch.html) 안 올라간 걸 지우는 일이 없게 */
  var TAB = Math.random().toString(36).slice(2, 10), OPENED = Date.now();
  function dmap(k) { try { var m = JSON.parse(g(k) || '{}'); return m && typeof m === 'object' && !Array.isArray(m) ? m : {}; } catch (e) { return {}; } }
  window.dwDirty = {
    mark: function (k) {
      if (window.__dwSyncApplying) return;   /* 서버에서 받아 넣는 건 「이 기기에서 고침」이 아님 */
      try { var m = dmap(k), now = Date.now(); m[TAB] = now; Object.keys(m).forEach(function (t) { if (now - m[t] > 7 * 864e5) delete m[t]; }); localStorage.setItem(k, JSON.stringify(m)); } catch (e) {}
    },
    init: function (k) { if (g(k) == null) window.dwDirty.mark(k); },
    canVouch: function (k) { var m = dmap(k); return Object.keys(m).every(function (t) { return t === TAB || m[t] <= OPENED; }); }
  };
  window.dwOwner = {
    get: owner, session: sessUid, go: go,
    /* 회원 탈퇴 뒤: 이 휴대폰에 남은 그 계정 기록을 남기지 않고 비움 (2026.10.28-22) */
    erase: function () { window.DW_HOLD = window.DW_FREEZE = true; root.classList.add('dw-gated'); try { sessionStorage.setItem('dw-erase', '1'); } catch (e) {} location.replace('switch.html?m=erase&back=./'); },
    /* 로그인 · 가입한 바로 뒤: 이 기기 기록 주인과 다르면(가입은 언제나) 계정 바꾸기 화면으로 → true */
    after: function (uid, join) {
      if (!uid) return false;
      if (join || owner() !== uid) { go(uid, join ? 'join' : 'login'); return true; }
      try { localStorage.setItem(OK, uid); } catch (e) {}
      return false;
    }
  };
  /* 다른 창에서 계정을 바꾸거나 로그아웃하면: 이 창은 저장을 멈추고(DW_FREEZE) 다시 열림 */
  window.addEventListener('storage', function (e) {
    if (e.key === SWK && e.newValue) { window.DW_HOLD = window.DW_FREEZE = true; root.classList.add('dw-gated'); return; }
    if (e.key === SWK || e.key === OK) { window.DW_HOLD = true; location.reload(); return; }
    if (e.key === 'dw-sb-auth' && sessUid() !== loaded) { window.DW_HOLD = true; location.reload(); }
  });
  if (g(SWK)) { go(loaded, 'login'); return; }   /* 계정 바꾸기가 끝나지 않았음 → 마저 */
  if (!loaded) return;
  var t = Number(g(IK)) || 0;
  if (t && Date.now() - t >= IDLE && !window.dwMobile()) { window.DW_IDLE = window.DW_HOLD = true; root.classList.add('dw-gated'); return; }   /* PC 에서 10분 넘게 안 씀 → leader-gate.html 이 로그아웃 (휴대폰 · 태블릿은 로그인 유지) */
  var o = owner();
  try { if (!g(OK)) localStorage.setItem(OK, o || loaded); localStorage.setItem(IK, String(Date.now())); } catch (e) {}
  if (o && o !== loaded) go(loaded, 'login');
})();
</script>
<script>
(function () {
  var root = document.documentElement;
  if (window.DW_HOLD) { root.classList.add('dw-gated'); return; }
  try {
    var s = JSON.parse(localStorage.getItem('dw-sb-auth') || 'null');
    if (s && s.user && s.user.id && (s.user.app_metadata || {}).dw_pw_reset && sessionStorage.getItem('dw-pw-clear') !== s.user.id) {
      window.DW_PWRESET = window.DW_HOLD = true; root.classList.add('dw-gated'); return;   /* 비밀번호 초기화된 계정 → 새 비밀번호를 정해야 씀 (leader-gate.html) — 그동안 저장 · 서버 맞추기 안 함 */
    }
    if (s && s.user && s.user.id) {
      var am = s.user.app_metadata || {};
      var lead = am.dw_role === 'leader' || localStorage.getItem('dw-leader') === s.user.id;
      var chief = !lead && (am.dw_role === 'chief' || localStorage.getItem('dw-chief') === s.user.id);
      root.classList.add(lead ? 'dw-leader' : chief ? 'dw-chief' : 'dw-member');
      if (!lead && !chief && window.DW_LEADER_ONLY) location.replace('funeral.html');
      if (chief && window.DW_STAFF_ONLY) location.replace('./#gather');
    } else root.classList.add('dw-gated');
  } catch (e) { root.classList.add('dw-gated'); }
})();
</script>
