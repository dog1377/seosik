     총괄실장(dw_role = 'chief', 2026.10.26) → html.dw-chief: 서식 · 회사 서류 · 취합 · 설정만 ([data-nochief] 숨김, [data-chief] 보임),
     window.DW_STAFF_ONLY 인 화면(장례업무)은 총괄실장이면 취합으로.
     이 기기에서 한 번 확인되면(dw-leader · dw-chief) 인터넷이 없어도 그 메뉴로 열고, 인터넷이 되면 다시 확인함. 화면은 leader-gate.html. -->

.dwme{position:fixed;inset:0;z-index:2147480000;display:flex;align-items:flex-end;justify-content:center;font-family:inherit;color:var(--ink,#1c1d1f);word-break:keep-all}

.dwme-panel{position:relative;width:100%;max-width:520px;max-height:calc(100dvh - 24px);overflow:auto;overscroll-behavior:contain;background:var(--surface,#fff);border:1px solid var(--line,#d6d7d4);border-bottom:0;border-radius:6px 6px 0 0;padding:6px 20px calc(env(safe-area-inset-bottom,0px) + 20px);box-sizing:border-box}

.dwme input::placeholder{color:var(--ph,var(--muted,#6a6e73));opacity:1}
.dwme input:focus{outline:none;border-color:var(--ink,#1c1d1f);box-shadow:0 0 0 1px var(--ink,#1c1d1f)}

.dwme-main{border:1px solid var(--ink,#1c1d1f);background:var(--accent,#1c1d1f);color:var(--accent-ink,#fff)}

.dwme-ranks button[aria-pressed="true"]{border-color:var(--ink,#1c1d1f);background:var(--ink,#1c1d1f);color:var(--surface,#fff)}

/* 칸 바꾸기 (2026.10.29 행사 · 서식, 2026.10.30 배송 더함 — leader-gate.html modeSwitch): 파트장 = 행사 · 서식 · 배송, 직원 = 행사 · 배송, 총괄실장 = 없음(서식만) */
.dw-mode{display:inline-flex;flex:none;border:1px solid var(--ink,#1c1d1f);border-radius:4px;overflow:hidden;background:var(--surface,#fff)}
.dw-mode button{font:inherit;font-size:14px;font-weight:600;min-height:38px;min-width:54px;padding:0 12px;border:0;border-radius:0;background:transparent;color:var(--ink,#1c1d1f);cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.dw-mode button+button{border-left:1px solid var(--ink,#1c1d1f)}

.dw-mode button:focus-visible{outline:2px solid var(--accent,#1c1d1f);outline-offset:-4px}

.ab-in .dw-mode{margin-right:2px}

.st-no{display:inline-grid;place-items:center;flex:none;width:20px;height:20px;box-sizing:border-box;border:1px solid var(--edge,var(--line-2,currentColor));border-radius:50%;font-style:normal;font-size:11.5px;font-weight:700;line-height:1;letter-spacing:0;color:inherit;font-variant-numeric:tabular-nums}
.done>.st-no{border-color:var(--ink,#1c1d1f);color:var(--ink,#1c1d1f)}

/* 휴대폰 첫 화면 · 홈 (2026.10.30 사용자 「모바일 화면 ATM 큰 글씨처럼 큰 바둑판 배열로 · 원하는 기능으로만 바로」 · 「홈 화면으로 돌아가기」)
   휴대폰(699px 이하): 앱을 열면 그 칸의 첫 화면(큰 칸 바둑판 · 맨 위 큰 칸 바꾸기). 다른 화면에서는 위 막대 왼쪽 「‹ 홈」(첫 화면으로), 아래 메뉴 없음.
   위 막대의 작은 칸 바꾸기 · 로그아웃은 휴대폰에서는 첫 화면에서만(칸 바꾸기는 바둑판 위 큰 버튼). 태블릿 · PC 는 예전처럼 위 메뉴 줄. html.dw-at-home = 지금 첫 화면 */
.dw-home-btn{display:none;flex:none;align-items:center;gap:2px;height:44px;padding:0 12px 0 6px;border:1px solid var(--ink,#1c1d1f);border-radius:4px;background:var(--surface,#fff);color:var(--ink,#1c1d1f);font:inherit;font-size:16px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap}
.dw-home-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

}
/* 첫 화면 (2026.11.11, 사용자가 고른 바둑판 시안 3안 「칸 바꾸기 없이 한 화면」 — 시안 그림판 「DW장례업무 휴대폰 첫 화면 바둑판 시안 3안」)
   위에서부터: 이름 + 「할 일 N건 ›」(누르면 그 아래 할 일 상자가 펼쳐짐) → 묶음 카드(행사 · 서식(파트장) · 배송)마다 4칸 그림 바둑판.
   총괄실장은 서식 묶음 하나. 칸 바꾸기 · 아래 고정 큰 버튼 없음(새 행사 · 새 배송은 묶음 첫 칸, 먹색).
   예전 -5 의 흐린 사진 바탕 · 색 줄 · 엇갈린 카드 · 「좋은 하루입니다」, -7 의 먹색 머리 · 국화 그림, -8 의 업무 목록 줄은 다시 넣지 말 것 */
.dwg{display:grid;gap:12px;max-width:560px;padding:4px 0 28px}

.dwg-todo:focus-visible{outline:2px solid var(--ink,#191b1f);outline-offset:2px}
.dwg-sec{border-radius:20px;background:var(--surface,#fff);padding:14px 8px 16px}

.dwg-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));row-gap:16px;column-gap:4px}

.dwg-i{width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:var(--accent-soft,#eef0f3);color:var(--ink,#191b1f);transition:transform .12s ease}

.dwg-t.pri .dwg-i{background:var(--accent,#191b1f);color:var(--accent-ink,#fff)}
.dwg-l{max-width:100%;font-size:14px;font-weight:600;line-height:1.25;letter-spacing:-.02em;text-align:center;word-break:keep-all}
.dwg-b{position:absolute;top:-5px;left:50%;margin-left:18px;min-width:24px;height:24px;padding:0 7px;box-sizing:border-box;display:grid;place-items:center;border-radius:12px;background:var(--warn,#a43c1c);color:var(--surface,#fff);font-size:13px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}

.dwg-t:focus-visible{outline:2px solid var(--ink,#191b1f);outline-offset:2px}
.dwh-box{border-radius:18px;background:var(--surface,#fff);overflow:hidden}

.dwh-row:active{background:var(--accent-soft,#eef0f3)}

.dwh-row+.dwh-row{border-top:1px solid var(--line,#e5e8eb)}
.dwh-ic{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--gold-soft,#f5efe2);color:var(--bronze,#8c6a1f)}
