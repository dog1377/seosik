<!-- DW장례업무 · 로그인 (2026.10.23-6): 로그인해야 열림. 파트장 계정(수파베이스 app_metadata.dw_role = 'leader')이면 모든 메뉴,
     아니면 관리자 기능([data-admin]: 서식 · 설정)만 숨김 → html.dw-member. window.DW_LEADER_ONLY 인 화면(회사 서류)은 파트장 · 총괄실장이 아니면 홈으로.
     총괄실장(dw_role = 'chief', 2026.10.26) → html.dw-chief: 서식 · 회사 서류 · 취합 · 설정만 ([data-nochief] 숨김, [data-chief] 보임),
     window.DW_STAFF_ONLY 인 화면(장례업무)은 총괄실장이면 취합으로.
     이 기기에서 한 번 확인되면(dw-leader · dw-chief) 인터넷이 없어도 그 메뉴로 열고, 인터넷이 되면 다시 확인함. 화면은 leader-gate.html. -->
<style id="dw-gate-ui">
html.dw-gated body>*:not(#dwGate):not(#toast){visibility:hidden!important}
html.dw-member [data-admin]{display:none!important}
html.dw-chief [data-nochief]{display:none!important}
html:not(.dw-chief) [data-chief]{display:none!important}
#dwGate{position:fixed;inset:0;z-index:2147482000;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);background:var(--bg,#f3f3f1);color:var(--ink,#1c1d1f);overflow:auto}
#dwGate[hidden]{display:none!important}
.gt-card{width:100%;max-width:340px;display:grid;gap:12px;text-align:center}
.gt-card img{width:72px;height:72px;border-radius:6px;margin:0 auto 4px}
.gt-card h1{margin:0 0 10px;font-family:var(--serif,var(--font-display,serif));font-size:24px;line-height:1.35}
.gt-card input{width:100%;box-sizing:border-box;font:inherit;font-size:17px;text-align:center;min-height:52px;padding:10px 14px;border-radius:4px;border:1px solid var(--edge,var(--line-2,#9a9d9a));background:var(--surface,#fff);color:inherit}
.gt-card input::placeholder{color:var(--ph,var(--muted,#6a6e73));opacity:1}
.gt-card input:focus{outline:none;border-color:var(--ink,#1c1d1f);box-shadow:0 0 0 1px var(--ink,#1c1d1f)}
.gt-card button{font:inherit;font-size:16px;font-weight:700;min-height:52px;border-radius:4px;cursor:pointer;border:1px solid var(--ink,#1c1d1f);background:var(--accent,#1c1d1f);color:var(--accent-ink,#fff);margin-top:4px}
.gt-card button.gt-link{justify-self:center;min-height:44px;margin:0;padding:0 12px;border:0;background:none;color:var(--muted,#5a5e63);font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.gt-card button:disabled{opacity:.5}
.gt-err{margin:0;min-height:20px;font-size:14px;color:var(--warn,#9a3b1e);font-weight:600;line-height:1.5;word-break:keep-all}
.gt-err:empty{min-height:0}
/* 화면 밝기 고르기 (2026.10.26-9) */
.dw-theme-seg{display:inline-flex;gap:2px;padding:2px;border-radius:5px;background:var(--surface-2,var(--field,#f3f3f1));border:1px solid var(--line,#d6d7d4)}
.dw-theme-seg button{font:inherit;font-size:13px;font-weight:600;min-height:36px;min-width:52px;padding:0 10px;border:0;border-radius:4px;background:transparent;color:var(--muted,#5a5e63);cursor:pointer}
.dw-theme-seg button[aria-pressed="true"]{background:var(--surface,#fff);color:var(--ink,#1c1d1f);box-shadow:0 0 0 1px var(--ink,#1c1d1f)}
.dw-theme-seg button:focus-visible{outline:2px solid var(--ink,#1c1d1f);outline-offset:1px}
.dw-theme-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dw-theme-row>span{font-size:13px;font-weight:600;color:var(--ink,#1c1d1f)}
@media (max-width:560px){.dw-theme-seg button{min-height:44px}}
/* 로그아웃 버튼 · 위 막대 오른쪽 끝 (2026.10.28-20). 위 막대가 화면 위에 붙어 있어서 늘 보임 */
.dw-out{display:inline-flex;align-items:center;justify-content:center;gap:5px;flex:none;min-height:40px;padding:0 11px 0 9px;border:1px solid var(--line-2,var(--edge,#9a9d9a));border-radius:4px;background:var(--surface,#fff);color:var(--ink,#1c1d1f);font:inherit;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dw-out svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dw-out:focus-visible{outline:2px solid var(--ink,#1c1d1f);outline-offset:2px}
.dw-out:disabled{opacity:.5}
@media (hover:hover){.dw-out:hover{border-color:var(--ink,#1c1d1f)}}
.appbar-in .brand{flex:none}
.appbar-in .local{min-width:0;flex:0 1 auto;margin-left:auto}
.appbar-in .local span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar-in .local .ac-sfx{flex:none;overflow:visible}
@media (max-width:560px){.appbar-in .local .ac-sfx{display:none}}
@media (max-width:560px){.ab-in .dw-out{width:44px;min-width:44px;min-height:44px;padding:0}.ab-in .dw-out span{display:none}.dw-out{min-height:44px}}
@media (max-width:340px){.dw-out{width:44px;padding:0}.dw-out span{display:none}}
.gt-note{margin:0;font-size:14px;line-height:1.5;color:var(--muted,#5a5e63);font-weight:600;word-break:keep-all;text-wrap:balance}
.gt-note:empty{display:none}
</style>
<script>
/* 화면 밝기: 자동(휴대폰 설정 따라) · 밝게 · 어둡게. <html data-theme> 로 색을 바꿈 (각 화면 CSS가 data-theme 를 앎). 같은 기기 모든 화면 · 휴무 화면(iframe)에 같이 적용 */
(function () {
  var root = document.documentElement, KEY = 'dw-theme';
  function get() { try { var v = localStorage.getItem(KEY); return v === 'dark' || v === 'light' ? v : ''; } catch (e) { return ''; } }
  function isDark(m) { return m === 'dark' || (m !== 'light' && !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)); }
  function setOn(el, m) { if (!el) return; if (m) el.setAttribute('data-theme', m); else el.removeAttribute('data-theme'); }
  function sync() {
    var m = get();
    setOn(root, m);
    try { document.querySelectorAll('iframe').forEach(function (f) { try { setOn(f.contentDocument && f.contentDocument.documentElement, m); } catch (e) {} }); } catch (e) {}
    try { document.querySelectorAll('meta[name="theme-color"]').forEach(function (t) {
      if (t.dataset.dwC == null) { t.dataset.dwC = t.getAttribute('content') || ''; t.dataset.dwM = t.getAttribute('media') || ''; }
      if (m) { t.setAttribute('content', isDark(m) ? '#121314' : '#ffffff'); t.removeAttribute('media'); }
      else { t.setAttribute('content', t.dataset.dwC); if (t.dataset.dwM) t.setAttribute('media', t.dataset.dwM); }
    }); } catch (e) {}
    try { document.querySelectorAll('[data-dwtheme]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-dwtheme') === m)); }); } catch (e) {}
  }
  window.dwTheme = {
    get: get, sync: sync, dark: function () { return isDark(get()); },
    set: function (m) { try { if (m === 'dark' || m === 'light') localStorage.setItem(KEY, m); else localStorage.removeItem(KEY); } catch (e) {} sync(); try { window.dispatchEvent(new CustomEvent('dw-theme', { detail: get() })); } catch (e) {} },
    seg: function (label) {
      var m = get(), b = function (v, t) { return '<button type="button" data-dwtheme="' + v + '" aria-pressed="' + (m === v) + '">' + t + '</button>'; };
      return '<div class="dw-theme-seg" role="group" aria-label="' + (label || '화면 밝기') + '">' + b('', '자동') + b('light', '밝게') + b('dark', '어둡게') + '</div>';
    }
  };
  setOn(root, get());
  document.addEventListener('click', function (e) { var b = e.target.closest && e.target.closest('[data-dwtheme]'); if (b) { e.preventDefault(); window.dwTheme.set(b.getAttribute('data-dwtheme')); } });
  document.addEventListener('DOMContentLoaded', sync);
  window.addEventListener('storage', function (e) { if (e.key === KEY) sync(); });
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', sync); } catch (e) {}
})();
</script>
<script>
/* 계정마다 이 기기 기록 따로 · 10분 동안 안 쓰면 자동 로그아웃 (2026.10.28-20, 사용자: 「회원가입하면 가입한 사람은 정보가 하나도 없어야 함」 · 「10분 미조작시 자동 로그아웃」)
   - dw-owner = 이 기기에 지금 들어 있는 기록(장례업무 · 휴무 · 서식 · 회사 서류 · 자동 보관본 …)의 주인 계정 id.
     처음에는 예전 맞춤 표시(dw-sb-meta · dw-sync-* 의 uid)로 알아내고, 그것도 없으면 지금 로그인한 계정.
   - 로그인한 계정이 주인과 다르면 switch.html 로 보냄 → 주인 기록을 이 기기 보관함(IndexedDB dw-acct-stash)에 넣어 두고 비운 뒤,
     새 계정이 예전에 이 기기에 남긴 기록이 있으면 되살림. 지우는 기록은 없음(보관함에 남음). 그동안은 서버 맞추기를 멈춤(DW_HOLD).
   - dw-switching = 바꾸는 중 표시(끝나기 전에 앱이 꺼지면 다음에 열 때 마저 함), dw-last-act = 마지막으로 만진 시각(창 · 화면 공통). */
(function () {
  var root = document.documentElement, OK = 'dw-owner', SWK = 'dw-switching', IK = 'dw-last-act', IDLE = 10 * 60 * 1000;
  function g(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function metaUid(k) { try { var m = JSON.parse(g(k) || 'null'); return m && typeof m.uid === 'string' ? m.uid : ''; } catch (e) { return ''; } }
  function sessUid() { try { var x = JSON.parse(g('dw-sb-auth') || 'null'); return x && x.user && x.user.id || ''; } catch (e) { return ''; } }
  function owner() { return g(OK) || metaUid('dw-sb-meta') || metaUid('dw-sync-forms') || metaUid('dw-sync-company') || ''; }
  function here() { var p = location.pathname.split('/').pop() || ''; return (/^(index|funeral|admin)\.html$/.test(p) ? p : './') + (/^#[\w:-]*$/.test(location.hash) ? location.hash : ''); }
  function go(to, mode) {
    window.DW_HOLD = true; root.classList.add('dw-gated');
    location.replace('switch.html?to=' + encodeURIComponent(to || '') + '&m=' + (mode === 'join' ? 'join' : 'login') + '&back=' + encodeURIComponent(here()));
  }
  var loaded = sessUid();
  /* 고친 시각 표시 (2026.10.28-22): 서식 · 회사 서류 저장소가 고칠 때마다 창별로 시각을 적음 (dw-dirty-forms · dw-dirty-company = {창번호: 시각}).
     서버 맞추기(sync-kit)는 다른 창이 이 창을 연 뒤에 고친 적이 없을 때만 「다 올라감」(clean)을 적음 → 계정 바꿀 때(switch.html) 안 올라간 걸 지우는 일이 없게 */
  var TAB = Math.random().toString(36).slice(2, 10), OPENED = Date.now();
  function dmap(k) { try { var m = JSON.parse(g(k) || '{}'); return m && typeof m === 'object' && !Array.isArray(m) ? m : {}; } catch (e) { return {}; } }
  window.dwDirty = {
    mark: function (k) {
      if (window.__dwSyncApplying) return;   /* 서버에서 받아 넣는 건 「이 기기에서 고침」이 아님 */
      try { var m = dmap(k), now = Date.now(); m[TAB] = now; Object.keys(m).forEach(function (t) { if (now - m[t] > 7 * 864e5) delete m[t]; }); localStorage.setItem(k, JSON.stringify(m)); } catch (e) {}
    },
    init: function (k) { if (g(k) == null) window.dwDirty.mark(k); },
    canVouch: function (k) { var m = dmap(k); return Object.keys(m).every(function (t) { return t === TAB || m[t] <= OPENED; }); }
  };
  window.dwOwner = {
    get: owner, session: sessUid, go: go,
    /* 회원 탈퇴 뒤: 이 휴대폰에 남은 그 계정 기록을 남기지 않고 비움 (2026.10.28-22) */
    erase: function () { window.DW_HOLD = window.DW_FREEZE = true; root.classList.add('dw-gated'); try { sessionStorage.setItem('dw-erase', '1'); } catch (e) {} location.replace('switch.html?m=erase&back=./'); },
    /* 로그인 · 가입한 바로 뒤: 이 기기 기록 주인과 다르면(가입은 언제나) 계정 바꾸기 화면으로 → true */
    after: function (uid, join) {
      if (!uid) return false;
      if (join || owner() !== uid) { go(uid, join ? 'join' : 'login'); return true; }
      try { localStorage.setItem(OK, uid); } catch (e) {}
      return false;
    }
  };
  /* 다른 창에서 계정을 바꾸거나 로그아웃하면: 이 창은 저장을 멈추고(DW_FREEZE) 다시 열림 */
  window.addEventListener('storage', function (e) {
    if (e.key === SWK && e.newValue) { window.DW_HOLD = window.DW_FREEZE = true; root.classList.add('dw-gated'); return; }
    if (e.key === SWK || e.key === OK) { window.DW_HOLD = true; location.reload(); return; }
    if (e.key === 'dw-sb-auth' && sessUid() !== loaded) { window.DW_HOLD = true; location.reload(); }
  });
  if (g(SWK)) { go(loaded, 'login'); return; }   /* 계정 바꾸기가 끝나지 않았음 → 마저 */
  if (!loaded) return;
  var t = Number(g(IK)) || 0;
  if (t && Date.now() - t >= IDLE) { window.DW_IDLE = window.DW_HOLD = true; root.classList.add('dw-gated'); return; }   /* 10분 넘게 안 씀 → leader-gate.html 이 로그아웃 */
  var o = owner();
  try { if (!g(OK)) localStorage.setItem(OK, o || loaded); localStorage.setItem(IK, String(Date.now())); } catch (e) {}
  if (o && o !== loaded) go(loaded, 'login');
})();
</script>
<script>
(function () {
  var root = document.documentElement;
  if (window.DW_HOLD) { root.classList.add('dw-gated'); return; }
  try {
    var s = JSON.parse(localStorage.getItem('dw-sb-auth') || 'null');
    if (s && s.user && s.user.id) {
      var am = s.user.app_metadata || {};
      var lead = am.dw_role === 'leader' || localStorage.getItem('dw-leader') === s.user.id;
      var chief = !lead && (am.dw_role === 'chief' || localStorage.getItem('dw-chief') === s.user.id);
      root.classList.add(lead ? 'dw-leader' : chief ? 'dw-chief' : 'dw-member');
      if (!lead && !chief && window.DW_LEADER_ONLY) location.replace('./#home');
      if (chief && window.DW_STAFF_ONLY) location.replace('./#gather');
    } else root.classList.add('dw-gated');
  } catch (e) { root.classList.add('dw-gated'); }
})();
</script>
