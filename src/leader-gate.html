<!-- DW장례업무 · 로그인 화면 (leader-gate-head.html 과 같이 씀). 2026.10.23-6: 설명 없이 이메일 · 비밀번호만, 파트장이 아니면 관리자 기능만 숨김 -->
<script>
(function () {
  'use strict';
  var SK = 'dw-sb-auth', LK = 'dw-leader', DOMAIN = 'dwfuneral.com';
  var SB_URL = 'https://bruqeidlbougfdveomag.supabase.co', SB_KEY = 'sb_publishable_nA1F7Ye-9e5Xy6Zj4xTQjg_J56YLY2P';
  var root = document.documentElement, client = null;
  function sess() { try { return JSON.parse(localStorage.getItem(SK) || 'null'); } catch (e) { return null; } }
  function idOf(u) { var e = String((u && u.email) || ''); return e.slice(-(DOMAIN.length + 1)) === '@' + DOMAIN ? e.slice(0, -(DOMAIN.length + 1)) : e; }
  function isLeader(u) { return !!(u && u.app_metadata && u.app_metadata.dw_role === 'leader'); }
  function setLeader(u) { try { if (u && isLeader(u)) localStorage.setItem(LK, u.id); else localStorage.removeItem(LK); } catch (e) {} }
  function lib() {
    return window.supabase && window.supabase.createClient ? Promise.resolve() : new Promise(function (res, rej) {
      var sc = document.createElement('script'); sc.src = 'vendor/supabase.js'; sc.onload = function () { res(); }; sc.onerror = function () { rej(new Error('lib')); }; document.head.appendChild(sc);
    });
  }
  /* 장례업무 화면에는 실시간 저장용 연결이 이미 있음 → 같은 것을 씀 (연결 두 개 만들지 않게) */
  function getClient() {
    if (typeof window.sbClient === 'function') return window.sbClient();
    if (client) return Promise.resolve(client);
    return lib().then(function () {
      client = window.supabase.createClient(SB_URL, SB_KEY, { auth: { storageKey: SK, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
      return client;
    });
  }
  /* 파트장 / 직원 표시: html.dw-leader · html.dw-member (직원이면 [data-admin] 숨김). 바뀌면 화면에 알림(dw-role) */
  function applyRole(u) {
    var lead = isLeader(u), was = root.classList.contains('dw-leader');
    if (!lead && window.DW_LEADER_ONLY) { location.replace('./#home'); return; }   /* 회사 서류: 파트장만 */
    root.classList.toggle('dw-leader', lead); root.classList.toggle('dw-member', !lead);
    if (was !== lead) { try { window.dispatchEvent(new CustomEvent('dw-role', { detail: { leader: lead } })); } catch (e) {} }
  }
  var box = null;
  /* 이메일 칸: 이메일을 그대로 넣거나, @ 없이 아이디만 넣으면 아이디@dwfuneral.com */
  function toEmail(v) { v = String(v || '').trim().toLowerCase(); return !v ? '' : v.indexOf('@') >= 0 ? v : v + '@' + DOMAIN; }
  function gate(mode, u) {
    root.classList.add('dw-gated');
    if (!box) {
      box = document.createElement('div'); box.id = 'dwGate'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-labelledby', 'gtTitle');
      document.body.appendChild(box);
    }
    box.hidden = false;
    var join = mode === 'join';
    box.innerHTML = '<form class="gt-card" autocomplete="on" novalidate><img src="icons/gukhwa-192.png" alt=""><h1 id="gtTitle">' + (join ? '회원가입' : 'DW장례업무') + '</h1>'
      + '<input id="gtId" type="email" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="이메일 입력" aria-label="이메일">'
      + '<input id="gtPw" type="password" autocomplete="' + (join ? 'new-password' : 'current-password') + '" placeholder="비밀번호 입력" aria-label="비밀번호">'
      + (join ? '<input id="gtPw2" type="password" autocomplete="new-password" placeholder="비밀번호 확인" aria-label="비밀번호 확인"><input id="gtName" autocomplete="name" placeholder="이름 입력" aria-label="이름">' : '')
      + '<button type="submit" id="gtGo">' + (join ? '가입하기' : '로그인') + '</button>'
      + '<p class="gt-err" id="gtErr" role="alert"></p>'
      + '<button type="button" class="gt-link" id="gtSwap">' + (join ? '로그인으로 돌아가기' : '회원가입') + '</button></form>';
    box.querySelector('#gtSwap').onclick = function () { gate(join ? 'login' : 'join', u); };
    var f = box.querySelector('form'), idEl = box.querySelector('#gtId'), pwEl = box.querySelector('#gtPw'), go = box.querySelector('#gtGo'), err = box.querySelector('#gtErr');
    if (u && u.email && !join) idEl.value = u.email;
    setTimeout(function () { (idEl.value ? pwEl : idEl).focus(); }, 50);
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var id = String(idEl.value || '').trim(), pw = String(pwEl.value || '');
      if (join) { joinSubmit(id, pw, String((box.querySelector('#gtPw2') || {}).value || ''), String((box.querySelector('#gtName') || {}).value || '').trim(), go, err); return; }
      if (!id || !pw) { err.textContent = '이메일과 비밀번호를 넣어 주세요.'; (id ? pwEl : idEl).focus(); return; }
      go.disabled = true; go.textContent = '로그인 중…'; err.textContent = '';
      getClient().then(function (c) { return c.auth.signInWithPassword({ email: toEmail(id), password: pw }); })
        .then(function (r) {
          if (r.error) { err.textContent = authMsg(r.error, false); return; }
          setLeader(r.data && r.data.user); location.reload();
        })
        .catch(function () { err.textContent = navigator.onLine === false ? '인터넷에 연결한 뒤 로그인해 주세요.' : '로그인하지 못했어요. 인터넷을 확인해 주세요.'; })
        .then(function () { if (go.isConnected) { go.disabled = false; go.textContent = '로그인'; } });
    });
  }
  /* 로그인 · 가입 오류를 알아듣기 쉽게 (수파베이스 오류 코드 기준). 모르는 오류는 끝에 오류 이름을 붙여 보여 줌 → 화면 캡처로 원인을 알 수 있게 */
  function authMsg(e, join) {
    var c = String((e && e.code) || ''), m = String((e && e.message) || ''), st = e && e.status;
    if (c === 'user_already_exists' || c === 'email_exists' || /already (been )?registered|already exists/i.test(m)) return '이미 가입된 이메일이에요. 로그인해 주세요.';
    if (c === 'signup_disabled' || c === 'email_provider_disabled' || /signups? not allowed|signup.*disabled/i.test(m)) return '지금은 회원가입이 꺼져 있어요. 관리자에게 말씀해 주세요. (회원가입 꺼짐)';
    if (c === 'email_address_not_authorized' || c === 'over_email_send_rate_limit' || /not authorized|email rate limit/i.test(m)) return '가입 확인 메일 설정 때문에 가입이 막혔어요. 관리자에게 말씀해 주세요. (이메일 확인 켜짐)';
    if (c === 'email_not_confirmed' || /not confirmed/i.test(m)) return '가입 확인이 안 된 계정이에요. 관리자에게 말씀해 주세요. (이메일 확인 안 됨)';
    if (c === 'invalid_credentials' || /invalid login|credentials/i.test(m)) return '이메일이나 비밀번호가 맞지 않아요.';
    if (c === 'weak_password' || /password/i.test(m)) return '비밀번호를 더 어렵게 해 주세요. (6자 이상, 영문과 숫자를 섞어서)';
    if (c === 'email_address_invalid' || c === 'validation_failed' || /invalid.*email|email.*invalid/i.test(m)) return '쓸 수 없는 이메일이에요. 다른 이메일로 해 주세요.';
    if (c === 'over_request_rate_limit' || st === 429) return '잠깐 사이에 너무 많이 시도했어요. 조금 뒤에 다시 해 주세요.';
    if (navigator.onLine === false) return '인터넷에 연결한 뒤 다시 해 주세요.';
    return (join ? '가입' : '로그인') + '하지 못했어요. (' + (c || m || '알 수 없는 오류').slice(0, 60) + ')';
  }
  function joinSubmit(id, pw, pw2, name, go, err) {
    var v = String(id || '').trim().toLowerCase();
    var ok = v.indexOf('@') >= 0 ? /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) : /^[a-z0-9][a-z0-9._-]{2,19}$/.test(v);
    if (!ok) { err.textContent = '이메일을 확인해 주세요.'; return; }
    if (pw.length < 6) { err.textContent = '비밀번호는 6자 이상으로 넣어 주세요.'; return; }
    if (pw !== pw2) { err.textContent = '비밀번호 확인이 달라요.'; return; }
    go.disabled = true; go.textContent = '가입 중…'; err.textContent = '';
    getClient().then(function (c) { return c.auth.signUp({ email: toEmail(v), password: pw, options: { data: name ? { name: name } : {} } }); })
      .then(function (r) {
        if (r.error) { err.textContent = authMsg(r.error, true); return; }
        if (!r.data || !r.data.session) { gate('login'); var e2 = box.querySelector('#gtErr'); if (e2) e2.textContent = '가입은 됐는데 「이메일 확인」이 켜져 있어서 아직 로그인이 안 돼요. 관리자에게 말씀해 주세요.'; return; }
        setLeader(r.data.user); location.reload();
      })
      .catch(function () { err.textContent = '가입하지 못했어요. 인터넷을 확인해 주세요.'; })
      .then(function () { if (go.isConnected) { go.disabled = false; go.textContent = '가입하기'; } });
  }
  /* 서버 함수 부르기 (게시판 · 파트 · 이름). 실패 이유: login · offline · noserver(서버 준비 안 됨) · net */
  function rpc(fn, args) {
    if (!acct.user()) return Promise.reject({ why: 'login' });
    if (navigator.onLine === false) return Promise.reject({ why: 'offline' });
    return getClient().then(function (c) { return c.rpc(fn, args || {}); }, function () { return Promise.reject({ why: 'offline' }); }).then(function (r) {
      if (r.error) {
        var m = String(r.error.message || '') + ' ' + String(r.error.code || '');
        return Promise.reject({ why: /PGRST202|could not find the function|schema cache|does not exist/i.test(m) ? 'noserver' : r.error.status === 401 ? 'login' : 'net', error: r.error });
      }
      return r.data;
    }, function (e) { return Promise.reject(e && e.why ? e : { why: navigator.onLine === false ? 'offline' : 'net' }); });
  }
  /* 관리자 서식 「내 계정」 · 위 막대 표시 (로그아웃 · 이름 · 회원 탈퇴) */
  var acct = window.dwAcct = {
    user: function () { var s = sess(); return s && s.user || null; },
    id: function () { return idOf(acct.user()); },
    leader: function () { return root.classList.contains('dw-leader'); },
    client: getClient,
    rpc: rpc,
    logout: function () {
      return getClient().then(function (c) { return c.auth.signOut().catch(function () { return c.auth.signOut({ scope: 'local' }); }); })
        .catch(function () {}).then(function () { try { localStorage.removeItem(LK); localStorage.removeItem(SK); } catch (e) {} location.reload(); });
    },
    deleteMe: function (pw) {
      var u = acct.user(); if (!u) return Promise.resolve('none');
      return getClient().then(function (c) {
        return c.auth.signInWithPassword({ email: u.email, password: pw }).then(function (r) {
          if (r.error) return /invalid|credential/i.test(r.error.message || '') ? 'pw' : 'net';
          return c.rpc('dw_delete_me').then(function (d) {
            if (d.error) return /function|not found|PGRST202|schema cache/i.test(String(d.error.message || '') + String(d.error.code || '')) ? 'nofn' : 'net';
            return c.auth.signOut({ scope: 'local' }).catch(function () {}).then(function () { try { localStorage.removeItem(LK); localStorage.removeItem(SK); localStorage.removeItem('dw-sb-meta'); } catch (e) {} return 'ok'; });
          });
        });
      }).catch(function () { return 'net'; });
    }
  };
  function renderAcct() {
    var u = acct.user(), card = document.getElementById('dwAcctCard'), pill = document.querySelector('.appbar .local span');
    if (pill && u) { pill.textContent = idOf(u) + ' · 내 계정'; var pl = pill.parentNode; pl.title = '내 계정 · 로그아웃'; pl.style.cursor = 'pointer'; pl.onclick = function () { if (typeof window.showTab === 'function') window.showTab('settings'); setTimeout(function () { var c = document.getElementById('dwAcctCard'); if (c) c.scrollIntoView({ block: 'start' }); }, 50); }; }
    if (!card) return;
    if (!u) { card.hidden = true; return; }
    card.hidden = false;
    var nm0 = String((u.user_metadata && u.user_metadata.name) || '');
    card.innerHTML = '<h2>내 계정</h2><p class="small-t">로그인: <b></b></p>'
      + '<div class="ac-name" id="acNameRow"><label class="field"><span>게시판에 보이는 이름</span><input id="acName" type="text" maxlength="20" autocomplete="name" placeholder="예: 서영우"></label><button class="btn small" type="button" id="acNameSave">이름 저장</button></div>'
      + '<p class="small-t muted">로그아웃해도 이 기기의 기록은 그대로 있어요.</p>'
      + '<button class="btn primary block" type="button" id="acOut">로그아웃</button>'
      + '<button class="btn quiet small" type="button" id="acDelOpen">회원 탈퇴</button>'
      + '<div id="acDelBox" class="ac-del" hidden><p class="small-t" style="color:var(--warn)">탈퇴하면 내 계정과 서버에 저장된 기록이 모두 지워지고 되돌릴 수 없어요. 이 기기에 있는 기록은 그대로 남아요.</p>'
      + '<label class="field"><span>비밀번호 확인</span><input id="acDelPw" type="password" autocomplete="current-password"></label>'
      + '<div class="grid2"><button class="btn danger" type="button" id="acDelGo">탈퇴하기</button><button class="btn" type="button" id="acDelNo">취소</button></div><p class="small-t" id="acDelMsg" role="alert"></p></div>';
    card.querySelector('b').textContent = idOf(u);
    var nameEl = card.querySelector('#acName'), nameBtn = card.querySelector('#acNameSave');
    nameEl.value = nm0;
    rpc('dw_me').then(function (d) { if (d && d.ok && nameEl.isConnected && document.activeElement !== nameEl) nameEl.value = d.name || ''; })
      .catch(function (e) { if (e && e.why === 'noserver') { var row = card.querySelector('#acNameRow'); if (row) row.hidden = true; } });
    nameBtn.onclick = function () {
      nameBtn.disabled = true;
      rpc('dw_set_name', { p_name: nameEl.value }).then(function (d) {
        nameEl.value = (d && d.name) || ''; if (typeof window.toast === 'function') window.toast('이름을 저장했어요');
        try { window.dispatchEvent(new CustomEvent('dw-name')); } catch (e) {}
      }).catch(function (e) { if (typeof window.toast === 'function') window.toast(e && e.why === 'offline' ? '인터넷에 연결한 뒤 저장해 주세요' : '이름을 저장하지 못했어요'); })
        .then(function () { nameBtn.disabled = false; });
    };
    card.querySelector('#acOut').onclick = function () { this.disabled = true; acct.logout(); };
    card.querySelector('#acDelOpen').onclick = function () { card.querySelector('#acDelBox').hidden = false; this.hidden = true; card.querySelector('#acDelPw').focus(); };
    card.querySelector('#acDelNo').onclick = function () { card.querySelector('#acDelBox').hidden = true; card.querySelector('#acDelOpen').hidden = false; };
    card.querySelector('#acDelGo').onclick = function () {
      var b = this, pw = card.querySelector('#acDelPw').value, msg = card.querySelector('#acDelMsg');
      if (!pw) { msg.textContent = '비밀번호를 넣어 주세요.'; return; }
      b.disabled = true; b.textContent = '탈퇴하는 중…';
      acct.deleteMe(pw).then(function (r) {
        if (r === 'ok') { location.reload(); return; }
        msg.textContent = r === 'pw' ? '비밀번호가 맞지 않아요.' : r === 'nofn' ? '지금은 탈퇴할 수 없어요. 잠시 뒤에 다시 해 주세요.' : '지금은 탈퇴하지 못했어요. 인터넷을 확인해 주세요.';
        b.disabled = false; b.textContent = '탈퇴하기';
      });
    };
  }
  function open(u) { root.classList.remove('dw-gated'); if (box) box.hidden = true; applyRole(u); renderAcct(); }
  /* 인터넷이 되면 서버에서 다시 확인 (파트장 지정 · 해제 반영, 로그인이 풀렸으면 다시 로그인) · 인터넷이 안 되면 이 기기 확인 결과대로 */
  function verify() {
    var s = sess();
    if (!s || !s.user) { setLeader(null); gate('login'); return; }
    getClient().then(function (c) { return c.auth.getUser(); }).then(function (r) {
      var u = r && r.data && r.data.user;
      if (u) { setLeader(u); open(u); return; }
      var st = r && r.error && r.error.status;
      if (st === 401 || st === 403) { setLeader(null); gate('login', s.user); }   /* 로그인이 풀림(비밀번호 바뀜 등) → 다시 로그인 */
    }).catch(function () { /* 인터넷 안 됨 → 지금 상태 그대로 */ });
  }
  if (root.classList.contains('dw-gated')) gate('login', (sess() || {}).user); else renderAcct();
  verify();
  window.addEventListener('online', verify);
})();
</script>
