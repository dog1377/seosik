<script>

  /* 파트장 / 총괄실장 / 직원 표시: html.dw-leader · html.dw-chief · html.dw-member (직원이면 [data-admin] 숨김, 총괄실장이면 [data-nochief] 숨김). 바뀌면 화면에 알림(dw-role) */

      + (out && out.why === 'idle' && !join ? '<p class="gt-note" role="status">10분 동안 쓰지 않아서 로그아웃됐어요. 다시 로그인해 주세요.</p>' : '')

  /* 로그인 · 가입 오류를 알아듣기 쉽게 (수파베이스 오류 코드 기준). 모르는 오류는 끝에 오류 이름을 붙여 보여 줌 → 화면 캡처로 원인을 알 수 있게 */
  function authMsg(e, join) {
    var c = String((e && e.code) || ''), m = String((e && e.message) || ''), st = e && e.status;

  }
  /* 로그인 · 가입 성공: 이 기기 기록 주인과 다른 계정(가입은 언제나)이면 계정 바꾸기 화면(switch.html)으로 → 가입한 계정은 빈 화면에서 시작 */
  function signedIn(u, join) {
    setLeader(u);
    try { localStorage.setItem(IK, String(Date.now())); } catch (e) {}
    if (u && window.dwOwner && window.dwOwner.after(u.id, join)) return;
    location.reload();
  }
  function joinSubmit(id, pw, pw2, name, go, err) {
    var v = String(id || '').trim().toLowerCase();
    var ok = v.indexOf('@') >= 0 ? /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) : /^[a-z0-9][a-z0-9._-]{2,19}$/.test(v);
    if (!ok) { err.textContent = '이메일을 확인해 주세요.'; return; }

  /* 서버 함수 부르기 (게시판 · 파트 · 이름). 실패 이유: login · offline · noserver(서버 준비 안 됨) · net */
  function rpc(fn, args) {

  /* 관리자 서식 「내 계정」 · 위 막대 표시 (로그아웃 · 이름 · 회원 탈퇴) */

    logout: function (why) {

  }
  function open(u) { root.classList.remove('dw-gated'); if (box) box.hidden = true; applyRole(u); renderAcct(); }
  /* 인터넷이 되면 서버에서 다시 확인 (파트장 지정 · 해제 반영, 로그인이 풀렸으면 다시 로그인) · 인터넷이 안 되면 이 기기 확인 결과대로 */
  function verify() {
    var s = sess();
    if (!s || !s.user) { setLeader(null); if (!box || box.hidden) gate('login'); return; }   /* 이미 로그인 화면이면 다시 그리지 않음 (넣던 글 · 안내 유지) */
    getClient().then(function (c) { return c.auth.getUser(); }).then(function (r) {
      var u = r && r.data && r.data.user;
      if (u) { setLeader(u); open(u); return; }
      var st = r && r.error && r.error.status;
      if (st === 401 || st === 403) { setLeader(null); gate('login', s.user); }   /* 로그인이 풀림(비밀번호 바뀜 등) → 다시 로그인 */
    }).catch(function () { /* 인터넷 안 됨 → 지금 상태 그대로 */ });
  }
  /* ---------- 10분 동안 안 쓰면 자동 로그아웃 (2026.10.28-20) ----------
     누르기 · 글쇠 · 손가락 · 휠을 「쓴 것」으로 봄(휴무 화면 iframe 안도). 마지막으로 쓴 시각은 이 기기 모든 창이 같이 씀(dw-last-act).
     30초마다 · 화면으로 돌아올 때 확인. 앱을 닫았다가 10분 지나서 열면 leader-gate-head.html 이 알아채고 여기서 로그인 화면으로. */
  var lastW = 0;
  function stamp() { var n = Date.now(); if (n - lastW < 15000) return; lastW = n; try { if (acct.user()) localStorage.setItem(IK, String(n)); } catch (e) {} }
  function idleCheck() {
    if (outBusy || window.DW_HOLD || !acct.user() || root.classList.contains('dw-gated')) return;
    var t = 0; try { t = Number(localStorage.getItem(IK)) || 0; } catch (e) {}
    if (!t) { lastW = 0; stamp(); return; }
    if (Date.now() - t >= IDLE) acct.logout('idle');
  }
  function watch(w) {
    try {
      if (!w || w.__dwIdle) return; w.__dwIdle = true;
      ['pointerdown', 'keydown', 'touchstart', 'wheel', 'input'].forEach(function (ev) { w.document.addEventListener(ev, stamp, { capture: true, passive: true }); });
    } catch (e) {}
  }
  watch(window);
  document.addEventListener('load', function (e) { var f = e.target; if (f && f.tagName === 'IFRAME') { try { watch(f.contentWindow); } catch (x) {} } }, true);
  try { document.querySelectorAll('iframe').forEach(function (f) { try { if (f.contentDocument && f.contentDocument.readyState === 'complete') watch(f.contentWindow); } catch (x) {} }); } catch (e) {}
  setInterval(idleCheck, 30000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') idleCheck(); });
  window.addEventListener('focus', idleCheck);

  /* ---------- 로그아웃 버튼: 위 막대 오른쪽 끝 (세 화면 공통) ---------- */
  function outButton() {
    if (document.getElementById('dwOut')) return;
    var bar = document.querySelector('header.appbar .appbar-in') || document.querySelector('header.appbar .ab-in');
    if (!bar) return;
    var b = document.createElement('button');
    b.type = 'button'; b.id = 'dwOut'; b.className = 'dw-out'; b.title = '로그아웃'; b.setAttribute('aria-label', '로그아웃');
    b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 20H5.5A1.5 1.5 0 0 1 4 18.5v-13A1.5 1.5 0 0 1 5.5 4H9"/><path d="M15.5 16.5 20 12l-4.5-4.5"/><path d="M20 12H9"/></svg><span>로그아웃</span>';
    b.addEventListener('click', function () {
      var go = function (ok) { if (!ok) return; b.disabled = true; acct.logout(); };
      if (typeof window.dwConfirm === 'function') window.dwConfirm({ title: '로그아웃할까요?', body: '이 기기의 기록은 그대로 있어요. 다시 들어올 때 이메일과 비밀번호를 넣어야 해요 (인터넷 연결 필요).', ok: '로그아웃', danger: false }).then(go);
      else go(true);
    });
    bar.appendChild(b);
  }

  if (window.DW_IDLE) {   /* 앱을 10분 넘게 안 쓰고 다시 열었음 → 이 기기 로그인만 풂 (기록은 그대로) */
    var u0 = acct.user();
    try { localStorage.removeItem(SK); localStorage.removeItem(LK); localStorage.removeItem(CK); localStorage.removeItem(IK); } catch (e) {}
    try { sessionStorage.setItem(OUTK, JSON.stringify({ why: 'idle', email: u0 && u0.email || '' })); } catch (e) {}
    gate('login');
    return;
  }
  if (window.DW_HOLD) return;   /* 계정 바꾸기 화면으로 넘어가는 중 */
  outButton();
  if (root.classList.contains('dw-gated')) gate('login', (sess() || {}).user); else renderAcct();
  verify();
  window.addEventListener('online', verify);
})();
</script>
