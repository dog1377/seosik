<!-- 앱 잠금: 회사가 정한 비밀번호(해시만 앱에 들어 있음)를 넣어야 앱이 열립니다. 해시가 비어 있으면 잠그지 않습니다. -->
<style id="lock-ui">
html.app-locked body>*:not(#appLock){visibility:hidden!important}
#appLock{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:24px;background:var(--bg,#f1f2ef);color:var(--ink,#1c2329);font-family:inherit}
#appLock[hidden]{display:none!important}
.lk-card{width:100%;max-width:360px;display:grid;gap:14px;text-align:center}
.lk-card img{width:64px;height:64px;border-radius:16px;margin:0 auto}
.lk-card h1{margin:0;font-size:21px;line-height:1.35}
.lk-card p{margin:0;font-size:14px;color:var(--muted,#6a7279);line-height:1.55}
.lk-card input{width:100%;box-sizing:border-box;font:inherit;font-size:18px;letter-spacing:.12em;text-align:center;padding:13px 14px;border-radius:12px;border:1px solid var(--line-2,#c9cfd3);background:var(--surface,#fff);color:inherit}
.lk-card input:focus{outline:none;border-color:var(--accent,#2b4a5c);box-shadow:0 0 0 3px var(--accent-soft,#e3ecf0)}
.lk-card button{font:inherit;font-size:16px;font-weight:700;min-height:50px;border:0;border-radius:12px;background:var(--accent,#2b4a5c);color:var(--accent-ink,#fff);cursor:pointer}
.lk-card button:disabled{opacity:.5}
.lk-err{min-height:20px;font-size:13.5px!important;color:var(--warn,#a4432e)!important;font-weight:600}
.lk-alt{font-size:13px!important}
.lk-alt a{color:var(--accent,#2b4a5c);font-weight:600}
.lk-shake{animation:lk-shake .32s}
@keyframes lk-shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.lk-shake{animation:none}}
</style>
<script>
(function () {
  'use strict';
  var C = __LOCK_CFG__;
  // C = { hash: 'p2$반복$소금$해시' 또는 '', key: 'mf', title: '관리자 서식함', who: '파트장', remember: true, relockMin: 0, alt: '' }
  if (!C || !C.hash || !window.crypto || !crypto.subtle) return;
  var TOKEN = C.hash.slice(-20);
  var store = C.remember ? 'localStorage' : 'sessionStorage';
  function get(k) { try { return window[store].getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { window[store].setItem(k, v); } catch (e) { /* ignore */ } }
  var KEY = C.key + '.unlock';
  var root = document.documentElement;
  var fails = 0, waitUntil = 0, relockReady = false;
  function isOpen() { return get(KEY) === TOKEN; }
  if (isOpen()) { setupRelock(); return; }
  root.classList.add('app-locked');

  function b64(buf) { var s = '', a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function unb64(t) { var s = atob(t), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function check(pw) {
    var p = C.hash.split('$'); if (p.length !== 4 || p[0] !== 'p2') return Promise.resolve(false);
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(p[2]), iterations: Number(p[1]) }, k, 256); })
      .then(function (bits) { return b64(bits) === p[3]; });
  }
  function build() {
    if (document.getElementById('appLock')) return;
    var box = document.createElement('div'); box.id = 'appLock'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-labelledby', 'lkTitle');
    box.innerHTML = '<form class="lk-card" autocomplete="on"><img src="icons/gukhwa-192.png" alt=""><h1 id="lkTitle"></h1><p id="lkSub"></p>'
      + '<input type="password" id="lkPw" autocomplete="current-password" aria-label="비밀번호" required>'
      + '<button type="submit" id="lkGo">열기</button><p class="lk-err" id="lkErr" role="alert"></p>'
      + (C.alt ? '<p class="lk-alt">' + C.alt + '</p>' : '') + '</form>';
    document.body.appendChild(box);
    box.querySelector('#lkTitle').textContent = C.title;
    box.querySelector('#lkSub').textContent = C.who + ' 비밀번호를 넣어야 열립니다.' + (C.remember ? ' 이 기기에서는 한 번만 넣으면 됩니다.' : '');
    var form = box.querySelector('form'), pw = box.querySelector('#lkPw'), go = box.querySelector('#lkGo'), err = box.querySelector('#lkErr');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var now = Date.now();
      if (now < waitUntil) { err.textContent = Math.ceil((waitUntil - now) / 1000) + '초 뒤에 다시 넣어 주세요.'; return; }
      if (!pw.value) return;
      go.disabled = true; err.textContent = '';
      check(pw.value).then(function (ok) {
        go.disabled = false;
        if (ok) { set(KEY, TOKEN); fails = 0; pw.value = ''; box.hidden = true; root.classList.remove('app-locked'); setupRelock(); try { window.dispatchEvent(new Event('app-unlocked')); } catch (x) { /* ignore */ } return; }
        fails++; pw.value = ''; pw.focus();
        if (fails >= 5) { waitUntil = Date.now() + 30000; fails = 0; err.textContent = '5번 틀렸습니다. 30초 뒤에 다시 넣어 주세요.'; }
        else err.textContent = '비밀번호가 맞지 않습니다.';
        form.classList.remove('lk-shake'); void form.offsetWidth; form.classList.add('lk-shake');
      }, function () { go.disabled = false; err.textContent = '이 화면에서는 확인할 수 없습니다. 주소가 https 인지 확인해 주세요.'; });
    });
    setTimeout(function () { pw.focus(); }, 60);
  }
  function lock() {
    root.classList.add('app-locked');
    var box = document.getElementById('appLock');
    if (box) { box.hidden = false; var pw = box.querySelector('#lkPw'); if (pw) { pw.value = ''; setTimeout(function () { pw.focus(); }, 60); } }
    else if (document.body) build();
  }
  function setupRelock() {
    if (relockReady || !C.relockMin) return; relockReady = true;
    var hiddenAt = 0;
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); return; }
      if (hiddenAt && Date.now() - hiddenAt > C.relockMin * 60000) { try { window[store].removeItem(KEY); } catch (e) { /* ignore */ } lock(); }
    });
  }
  if (document.body) build(); else document.addEventListener('DOMContentLoaded', build);
})();
</script>
